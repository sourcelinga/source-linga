<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pair · Source Linga</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Source Linga">
<meta name="theme-color" content="#f3f5ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07080d" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1d1d1b;--mute:#6b6a66;--line:#e3e1dc;--accent:#2f6b4f;--accent-ink:#fff;--warn:#a5481d}
@media (prefers-color-scheme:dark){:root{--bg:#0d0e0d;--panel:#1a1c19;--ink:#ecebe6;--mute:#9a9992;--line:#2e302c;--accent:#6fbf93;--accent-ink:#0f1a14;--warn:#e08a5f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 22px;max-width:380px;width:100%;text-align:center}
img{width:72px;height:72px;border-radius:16px}
h1{font-size:20px;margin:12px 0 4px}
p{color:var(--mute);margin:6px 0 18px;font-size:14px}
input{width:100%;font:600 28px/1 ui-monospace,Menlo,monospace;letter-spacing:8px;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{margin-top:14px;width:100%;padding:12px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font:600 16px/1 inherit;cursor:pointer}
#msg{min-height:22px;margin-top:10px;font-size:14px;color:var(--warn)}

/* Liquid Glass */
:root{--bg:#f3f5ff;--panel:rgba(255,255,255,.55);--ink:#12131a;--mute:#6d7186;--line:rgba(255,255,255,.8);--accent:#5566ff;--accent2:#9b5cff;--accent-ink:#fff;--warn:#d6493a;--good:#21a86a;--code:rgba(255,255,255,.55);--chip:rgba(85,102,255,.11);
  --rim:rgba(255,255,255,.9);--shadow:0 10px 40px rgba(40,50,120,.13);--b1:rgba(85,102,255,.42);--b2:rgba(155,92,255,.32);--b3:rgba(40,210,210,.26);--blur:saturate(1.8) blur(22px)}
@media (prefers-color-scheme:dark){:root{--bg:#07080d;--panel:rgba(30,32,48,.5);--ink:#f1f2f7;--mute:#8c90a3;--line:rgba(255,255,255,.12);--accent:#6f7dff;--accent-ink:#fff;--warn:#ff7d6b;--good:#4fe0a0;--code:rgba(0,0,0,.35);--chip:rgba(120,135,255,.16);
  --rim:rgba(255,255,255,.25);--shadow:0 14px 50px rgba(0,0,0,.55);--b1:rgba(85,102,255,.55);--b2:rgba(155,92,255,.42)}}
html{background:var(--bg)}
body{background:transparent}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(40% 45% at 10% 5%,var(--b1),transparent 70%),radial-gradient(40% 45% at 95% 30%,var(--b2),transparent 70%),radial-gradient(45% 45% at 35% 105%,var(--b3),transparent 70%)}
.card,header{background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:inset 1px 1px 0 var(--rim),var(--shadow)}
.card{border-radius:24px}
.card{padding:32px 24px}
img{border-radius:20px}
input{border-radius:18px;background:var(--chip);border:1px solid transparent}
input:focus{outline:none;box-shadow:0 0 0 4px rgba(85,102,255,.18)}
button{border-radius:99px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px rgba(85,102,255,.35)}
</style>
</head>
<body>
<form class="card" id="f">
  <img src="/icon-180.png" alt="">
  <h1>Pair this device</h1>
  <p>On your Mac, open Source Linga → <b>Devices</b> and type the 6-digit code shown there.</p>
  <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" required>
  <button type="submit">Pair</button>
  <div id="msg"></div>
</form>
<script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msg');m.textContent='';
  try{const r=await fetch('/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value})});
    const j=await r.json();if(r.ok){location.replace('/app')}else m.textContent=j.error||'Could not pair'}catch(err){m.textContent='Cannot reach the Mac. Same Wi-Fi?'}};
const h=location.hash.match(/code=(\d{6})/);if(h){document.getElementById('code').value=h[1];history.replaceState(null,'','/pair')}
fetch('/api/info').then(r=>r.json()).then(i=>{if(i.paired)location.replace('/app');else if(i.computer)document.querySelector('h1').textContent='Pair with '+i.computer}).catch(()=>{});
</script>
</body>
</html>
